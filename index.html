<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Phim</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:Arial, sans-serif;
    background:#0f0f0f;
    color:white;
    text-align:center;
}

/* POPUP */
.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:20px;
}

.popup-content{
    background:#1a1a1a;
    padding:30px;
    border-radius:18px;
    font-size:16px;
    max-width:320px;
    width:100%;
    position:relative;
    box-shadow:0 0 30px rgba(255,0,0,0.25);
}

.close-btn{
    position:absolute;
    top:8px;
    right:12px;
    font-size:20px;
    cursor:pointer;
}

/* CONTENT */
.header{
    padding:25px 15px 10px;
    font-size:20px;
    font-weight:bold;
}

.video-wrapper{
    padding:15px;
}

iframe{
    width:100%;
    height:220px;
    border-radius:16px;
}

.footer{
    margin-top:40px;
    padding:20px;
    font-size:12px;
    opacity:0.5;
}

@media(min-width:768px){
    iframe{height:450px;max-width:900px;}
}
</style>
</head>
<body>

<!-- POPUP -->
<div id="popup" class="popup">
    <div class="popup-content">
        Vui lòng ủng hộ quảng cáo ❤️<br>
        Xin cảm ơn ạ
        <span class="close-btn" onclick="handleClick()">✖</span>
    </div>
</div>

<div class="header">REVIEW PHIM TRỌN BỘ</div>

<div class="video-wrapper">
    <iframe 
        src="https://www.youtube.com/embed/dFqZLXGgFE4"
        frameborder="0"
        allowfullscreen>
    </iframe>
</div>

<div class="footer">© REVIEW PHIM 2026</div>

<script>
window.onload = function(){
    let count = localStorage.getItem("clickCount");
    let time = localStorage.getItem("clickTime");

    if(!count || !time || (Date.now() - time > 600000)){
        localStorage.setItem("clickCount", 0);
        localStorage.setItem("clickTime", Date.now());
        document.getElementById("popup").style.display = "flex";
    }else if(count < 2){
        document.getElementById("popup").style.display = "flex";
    }
};

function handleClick(){
    let count = localStorage.getItem("clickCount") || 0;
    count++;
    localStorage.setItem("clickCount", count);
    localStorage.setItem("clickTime", Date.now());

    if(count < 2){
        window.location.href = "https://s.shopee.vn/8KjFFnwNHZ";
    }else{
        document.getElementById("popup").style.display = "none";
    }
}
</script>

</body>
</html>
