<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Phim</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
}

/* POPUP */
.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.popup-content{
    background:#222;
    padding:30px 50px;
    border-radius:12px;
    position:relative;
    font-size:22px;
    font-weight:bold;
}

.close-btn{
    position:absolute;
    top:10px;
    right:15px;
    font-size:22px;
    cursor:pointer;
    color:white;
}

/* VIDEO */
.container{
    margin-top:80px;
}

iframe{
    width:80%;
    max-width:800px;
    height:450px;
    border-radius:12px;
}

.footer{
    margin-top:50px;
    padding:20px;
    font-size:14px;
    opacity:0.7;
}
</style>
</head>
<body>

<!-- POPUP -->
<div id="popup" class="popup" style="display:none;">
    <div class="popup-content">
        QUẢNG CÁO
        <span class="close-btn" onclick="closePopup()">X</span>
    </div>
</div>

<!-- WEBSITE CONTENT -->
<div class="container">
    <h2>page: review phim trọn bộ</h2>

    <!-- Thay link video nếu muốn -->
    <iframe 
        src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
        frameborder="0" 
        allowfullscreen>
    </iframe>

    <h3>demo</h3>
</div>

<div class="footer">
    © review phim trọn bộ
</div>

<script>
// Khi tải trang
document.addEventListener("DOMContentLoaded", function() {

    var popup = document.getElementById("popup");

    // Nếu chưa từng bấm quảng cáo
    if (localStorage.getItem("adsShown") === null) {
        popup.style.display = "flex";
    }
});

// Khi bấm X
function closePopup() {

    // Lưu lại đã xem quảng cáo
    localStorage.setItem("adsShown", "true");

    // Chuyển hướng
    window.location.href = "https://s.shopee.vn/8KjFFnwNHZ";
}
</script>

</body>
</html>
